<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Rich WebSocket Client</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #1a1a1a 0%, #2d2d30 100%);
                color: #ffffff;
                min-height: 100vh;
                padding: 2rem;
            }

            .container {
                max-width: 900px;
                margin: 0 auto;
            }

            h1 {
                text-align: center;
                margin-bottom: 3rem;
                font-size: 2.5rem;
                background: linear-gradient(45deg, #00d4ff, #0099cc);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            }

            .connection-section {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                padding: 2rem;
                margin-bottom: 2rem;
                border: 1px solid rgba(255, 255, 255, 0.2);
                transition: all 0.3s ease;
            }

            .connection-section.connected {
                background: rgba(0, 255, 0, 0.1);
                border-color: rgba(0, 255, 0, 0.3);
            }

            .setup-section {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                padding: 2rem;
                margin-bottom: 2rem;
                border: 1px solid rgba(255, 255, 255, 0.2);
                transition: all 0.3s ease;
            }

            .setup-section.hidden {
                opacity: 0;
                transform: translateY(-20px);
                pointer-events: none;
                height: 0;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            .setup-section h2 {
                text-align: center;
                margin-bottom: 2rem;
                font-size: 2rem;
                background: linear-gradient(45deg, #ffa502, #ff6348);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                text-shadow: 0 0 20px rgba(255, 165, 2, 0.3);
            }

            .message-setup-grid {
                display: grid;
                gap: 2rem;
                margin-top: 2rem;
            }

            .message-setup-grid.one-button {
                grid-template-columns: 1fr;
            }

            .message-setup-grid.two-buttons {
                grid-template-columns: 1fr 1fr;
            }

            .message-setup-grid.three-buttons {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .message-setup-grid.four-buttons {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .setup-card {
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(5px);
                border-radius: 15px;
                padding: 2rem;
                border: 1px solid rgba(255, 255, 255, 0.1);
                transition: all 0.3s ease;
            }

            .setup-card:hover {
                border-color: rgba(255, 255, 255, 0.3);
                transform: translateY(-5px);
            }

            .setup-card-title {
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: 1rem;
                text-align: center;
                color: #00d4ff;
            }

            .setup-input {
                width: 100%;
                padding: 1rem;
                border: 2px solid rgba(255, 255, 255, 0.2);
                border-radius: 12px;
                background: rgba(0, 0, 0, 0.3);
                color: #ffffff;
                font-size: 1rem;
                transition: all 0.3s ease;
            }

            .setup-input:focus {
                outline: none;
                border-color: #00d4ff;
                box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            }

            .url-input-group {
                display: flex;
                gap: 1rem;
                margin-bottom: 1.5rem;
                transition: all 0.3s ease;
            }

            .url-input-group.hidden {
                opacity: 0;
                transform: translateY(-20px);
                pointer-events: none;
                height: 0;
                margin: 0;
                overflow: hidden;
            }

            #url {
                flex: 1;
                padding: 1rem;
                border: 2px solid rgba(255, 255, 255, 0.2);
                border-radius: 12px;
                background: rgba(0, 0, 0, 0.3);
                color: #ffffff;
                font-size: 1rem;
                transition: all 0.3s ease;
            }

            #url:focus {
                outline: none;
                border-color: #00d4ff;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            }

            .connection-controls {
                display: flex;
                gap: 1rem;
                justify-content: center;
                margin-bottom: 1rem;
            }

            .button-count-controls {
                display: flex;
                gap: 1rem;
                justify-content: center;
                align-items: center;
                margin-bottom: 1rem;
                transition: all 0.3s ease;
            }

            .button-count-controls label {
                color: #00d4ff;
                font-weight: 600;
            }

            .button-count-controls select {
                padding: 0.5rem 1rem;
                border: 2px solid rgba(255, 255, 255, 0.2);
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.3);
                color: #ffffff;
                font-size: 1rem;
            }

            .button-count-controls select:focus {
                outline: none;
                border-color: #00d4ff;
                box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            }

            .btn {
                padding: 1rem 2rem;
                border: none;
                border-radius: 12px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none !important;
            }

            .btn-connect {
                background: linear-gradient(45deg, #00d4ff, #0099cc);
                color: white;
                box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
            }

            .btn-connect:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 8px 30px rgba(0, 212, 255, 0.4);
            }

            .btn-disconnect {
                background: linear-gradient(45deg, #ff4757, #c44569);
                color: white;
                box-shadow: 0 4px 20px rgba(255, 71, 87, 0.3);
            }

            .btn-disconnect:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 8px 30px rgba(255, 71, 87, 0.4);
            }

            .status-indicator {
                text-align: center;
                margin-top: 1rem;
                font-weight: 600;
                font-size: 1.1rem;
            }

            .status-disconnected {
                color: #ff6b6b;
            }

            .status-connected {
                color: #51cf66;
                text-shadow: 0 0 10px rgba(81, 207, 102, 0.5);
            }

            .main-controls {
                display: grid;
                gap: 3rem;
                margin: 3rem 0;
                height: 70vh;
                min-height: 500px;
            }

            .main-controls.one-button {
                grid-template-columns: 1fr;
            }

            .main-controls.two-buttons {
                grid-template-columns: 1fr 1fr;
            }

            .main-controls.three-buttons {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .main-controls.four-buttons {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .control-card {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border-radius: 30px;
                padding: 3rem;
                border: 1px solid rgba(255, 255, 255, 0.2);
                transition: all 0.3s ease;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .control-card:hover {
                transform: translateY(-10px) scale(1.02);
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
                border-color: rgba(255, 255, 255, 0.4);
            }

            .control-title {
                font-size: 2.5rem;
                font-weight: 700;
                margin-bottom: 2rem;
                color: #00d4ff;
                text-align: center;
                text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            }

            .message-input {
                width: 100%;
                padding: 1.5rem;
                border: 3px solid rgba(255, 255, 255, 0.3);
                border-radius: 20px;
                background: rgba(0, 0, 0, 0.4);
                color: #ffffff;
                font-size: 1.3rem;
                margin-bottom: 2rem;
                transition: all 0.3s ease;
                text-align: center;
            }

            .message-input:focus:not(:disabled) {
                outline: none;
                border-color: #00d4ff;
                box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
                transform: scale(1.05);
            }

            .message-input:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                border-color: rgba(255, 255, 255, 0.1);
                background: rgba(0, 0, 0, 0.2);
            }

            .btn-send {
                width: 100%;
                padding: 3rem 2rem;
                border: none;
                border-radius: 25px;
                font-size: 1.8rem;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.3s ease;
                text-transform: uppercase;
                letter-spacing: 2px;
                background: linear-gradient(45deg, #5f27cd, #341f97);
                color: white;
                box-shadow: 0 10px 40px rgba(95, 39, 205, 0.4);
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 200px;
            }

            .btn-send:hover:not(:disabled) {
                transform: translateY(-5px) scale(1.05);
                box-shadow: 0 20px 60px rgba(95, 39, 205, 0.6);
            }

            .btn-send:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none !important;
            }

            .btn-send.key1 {
                background: linear-gradient(45deg, #00d4ff, #0099cc);
                box-shadow: 0 10px 40px rgba(0, 212, 255, 0.4);
            }

            .btn-send.key1:hover:not(:disabled) {
                box-shadow: 0 20px 60px rgba(0, 212, 255, 0.6);
            }

            .btn-send.key2 {
                background: linear-gradient(45deg, #ff6b6b, #ee5a52);
                box-shadow: 0 10px 40px rgba(255, 107, 107, 0.4);
            }

            .btn-send.key2:hover:not(:disabled) {
                box-shadow: 0 20px 60px rgba(255, 107, 107, 0.6);
            }

            .locked-indicator {
                margin-top: 0.5rem;
                font-size: 0.9rem;
                color: #ffa502;
                display: none;
            }

            /* アニメーション */
            @keyframes pulse {
                0% {
                    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
                }
                50% {
                    box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
                }
                100% {
                    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
                }
            }

            .pulse {
                animation: pulse 2s infinite;
            }

            /* レスポンシブ対応 */
            @media (max-width: 768px) {
                .main-controls {
                    grid-template-columns: 1fr;
                    gap: 1rem;
                }

                .connection-controls {
                    flex-direction: column;
                }

                h1 {
                    font-size: 2rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 WebSocket Client</h1>

            <div class="connection-section" id="connection-section">
                <div class="url-input-group" id="url-input-group">
                    <input
                        id="url"
                        type="text"
                        placeholder="例: wss://abcd1234.ngrok.io"
                        value=""
                    />
                </div>

                <div class="connection-controls">
                    <button id="connect" class="btn btn-connect">
                        🔌 Connect
                    </button>
                    <button id="disconnect" class="btn btn-disconnect" disabled>
                        🔥 Disconnect
                    </button>
                </div>

                <div class="status-indicator">
                    <span id="status" class="status-disconnected"
                        >● Disconnected</span
                    >
                </div>
            </div>

            <div class="setup-section" id="setup-section">
                <h2>⚙️ Setup Messages</h2>

                <div class="button-count-controls">
                    <label for="button-count">ボタン数:</label>
                    <select id="button-count">
                        <option value="1" selected>1個</option>
                        <option value="2">2個</option>
                        <option value="3">3個</option>
                        <option value="4">4個</option>
                    </select>
                </div>

                <div class="message-setup-grid" id="message-setup-grid">
                    <!-- メッセージ設定エリアは動的に生成 -->
                </div>
            </div>

            <div
                class="main-controls one-button"
                id="main-controls"
                style="opacity: 0.3; pointer-events: none"
            >
                <!-- ボタンは動的に生成されます -->
            </div>
        </div>

        <script>
            const $ = (id) => document.getElementById(id);
            
            const storagedUrl = localStorage.getItem('url');
            if (storagedUrl) {
              $("url").value = storagedUrl;
            }

            let ws = null;
            let longPressTimers = {};
            let isLongPressing = {};
            let buttonCount = 1;
            let isConnected = false;
            let messagePresets = {}; // メッセージのプリセットを保存

            // ボタンの色とアイコン
            const buttonStyles = [
                {
                    gradient: "linear-gradient(45deg, #00d4ff, #0099cc)",
                    shadow: "rgba(0, 212, 255, 0.4)",
                    icon: "💎",
                },
                {
                    gradient: "linear-gradient(45deg, #ff6b6b, #ee5a52)",
                    shadow: "rgba(255, 107, 107, 0.4)",
                    icon: "🔥",
                },
                {
                    gradient: "linear-gradient(45deg, #5f27cd, #341f97)",
                    shadow: "rgba(95, 39, 205, 0.4)",
                    icon: "⚡",
                },
                {
                    gradient: "linear-gradient(45deg, #00d2d3, #54a0ff)",
                    shadow: "rgba(84, 160, 255, 0.4)",
                    icon: "🚀",
                },
            ];

            // ログ出力関数
            function log(message) {
                const timestamp = new Date().toLocaleTimeString();
                console.log(`[${timestamp}] ${message}`);
            }

            // メッセージ送信関数
            function sendMessage(buttonIndex) {
                const message = messagePresets[buttonIndex] || "";
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    log("❌ Not connected");
                    return false;
                }
                ws.send(message);
                log(`🚀 SENT (Button ${buttonIndex}): ${message}`);
                return true;
            }

            // 長押し処理開始
            function startLongPress(buttonIndex) {
                isLongPressing[buttonIndex] = true;
                longPressTimers[buttonIndex] = setInterval(() => {
                    if (isLongPressing[buttonIndex]) {
                        sendMessage(buttonIndex);
                    }
                }, 500);
            }

            // 長押し処理停止
            function stopLongPress(buttonIndex) {
                isLongPressing[buttonIndex] = false;
                if (longPressTimers[buttonIndex]) {
                    clearInterval(longPressTimers[buttonIndex]);
                    longPressTimers[buttonIndex] = null;
                }
            }

            // 全ての長押しタイマーを停止
            function stopAllLongPress() {
                for (let i = 1; i <= 4; i++) {
                    stopLongPress(i);
                }
            }

            // セットアップエリアのメッセージ設定を生成
            function generateMessageSetup(count) {
                const setupGrid = $("message-setup-grid");
                setupGrid.innerHTML = "";
                setupGrid.className = `message-setup-grid ${count === 1 ? "one-button" : count === 2 ? "two-buttons" : count === 3 ? "three-buttons" : "four-buttons"}`;

                for (let i = 1; i <= count; i++) {
                    const style = buttonStyles[i - 1];
                    const setupCard = document.createElement("div");
                    setupCard.className = "setup-card";
                    setupCard.innerHTML = `
                        <div class="setup-card-title">${style.icon} Button ${i} Message</div>
                        <input
                            id="setup-key${i}"
                            class="setup-input"
                            placeholder="Enter message for button ${i}..."
                            type="text"
                            value="${messagePresets[i] || ""}"
                        />
                    `;
                    setupGrid.appendChild(setupCard);

                    // 入力イベントリスナーを追加
                    setTimeout(() => {
                        const input = $(`setup-key${i}`);
                        input.addEventListener("input", (e) => {
                            messagePresets[i] = e.target.value;
                        });
                    }, 0);
                }
            }

            // 入力フィールドのロック状態を設定
            function setInputsLocked(locked) {
                // セットアップセクションの表示/非表示
                const setupSection = $("setup-section");
                if (locked) {
                    setupSection.classList.add("hidden");
                } else {
                    setupSection.classList.remove("hidden");
                }
            }

            // ボタンのイベントリスナーを設定
            function setupButtonEvents(buttonIndex) {
                const sendButton = $(`send-key${buttonIndex}`);

                // クリックイベント
                sendButton.onclick = () => {
                    sendMessage(buttonIndex);
                };

                // マウス長押し処理
                sendButton.addEventListener("mousedown", (e) => {
                    if (e.button === 0 && !sendButton.disabled) {
                        e.preventDefault();
                        sendMessage(buttonIndex);
                        startLongPress(buttonIndex);
                    }
                });

                sendButton.addEventListener("mouseup", (e) => {
                    if (e.button === 0) {
                        stopLongPress(buttonIndex);
                    }
                });

                sendButton.addEventListener("mouseleave", () => {
                    stopLongPress(buttonIndex);
                });

                // タッチ長押し処理
                sendButton.addEventListener("touchstart", (e) => {
                    if (!sendButton.disabled) {
                        e.preventDefault();
                        sendMessage(buttonIndex);
                        startLongPress(buttonIndex);
                    }
                });

                sendButton.addEventListener("touchend", (e) => {
                    e.preventDefault();
                    stopLongPress(buttonIndex);
                });

                sendButton.addEventListener("touchcancel", (e) => {
                    e.preventDefault();
                    stopLongPress(buttonIndex);
                });
            }

            // ボタンを生成
            function generateButtons(count) {
                const mainControls = $("main-controls");
                mainControls.innerHTML = "";

                // CSSクラスを更新
                mainControls.className = `main-controls ${count === 1 ? "one-button" : count === 2 ? "two-buttons" : count === 3 ? "three-buttons" : "four-buttons"}`;

                for (let i = 1; i <= count; i++) {
                    const style = buttonStyles[i - 1];
                    const controlCard = document.createElement("div");
                    controlCard.className = "control-card";

                    const message = messagePresets[i] || `Message ${i}`;
                    controlCard.innerHTML = `
                        <div class="control-title">${style.icon} ${message}</div>
                        <button id="send-key${i}" class="btn-send" disabled style="background: ${style.gradient}; box-shadow: 0 10px 40px ${style.shadow};">Send</button>
                    `;
                    mainControls.appendChild(controlCard);

                    // イベントリスナーを設定
                    setTimeout(() => setupButtonEvents(i), 0);
                }

                buttonCount = count;
            }

            // ボタン数変更イベント
            $("button-count").addEventListener("change", (e) => {
                const count = parseInt(e.target.value);
                stopAllLongPress(); // 既存の長押しを停止
                generateButtons(count);
                generateMessageSetup(count); // セットアップエリアも更新
            });

            $("connect").onclick = () => {
                const url = $("url").value.trim();
                if (!url) {
                    alert(
                        "wss URL を入力してください（例: wss://abcd1234.ngrok.io）",
                    );
                    return;
                }

                localStorage.setItem("url", url);

                // 空のメッセージがないかチェック
                let hasEmptyMessage = false;
                for (let i = 1; i <= buttonCount; i++) {
                    if (!messagePresets[i] || !messagePresets[i].trim()) {
                        hasEmptyMessage = true;
                        break;
                    }
                }

                if (hasEmptyMessage) {
                    alert("全てのボタンにメッセージを入力してください。");
                    return;
                }

                try {
                    ws = new WebSocket(url);
                } catch (e) {
                    log("WebSocket error: " + e);
                    return;
                }

                log("Connecting to " + url + " ...");
                $("connect").disabled = true;

                ws.onopen = () => {
                    log("✅ CONNECTION ESTABLISHED");
                    isConnected = true;

                    // UI の更新
                    $("disconnect").disabled = false;
                    for (let i = 1; i <= buttonCount; i++) {
                        const sendButton = $(`send-key${i}`);
                        if (sendButton) sendButton.disabled = false;
                    }
                    $("status").textContent = "● Connected";
                    $("status").className = "status-connected";
                    $("connection-section").classList.add("connected");
                    $("main-controls").style.opacity = "1";
                    $("main-controls").style.pointerEvents = "auto";

                    // 入力をロック
                    setInputsLocked(true);

                    // URLの入力欄を非表示
                    $("url-input-group").classList.add("hidden");
                };

                ws.onmessage = (ev) => {
                    log("📩 RECV: " + ev.data);
                };

                ws.onclose = (ev) => {
                    log(
                        `❌ CONNECTION CLOSED (code=${ev.code}, reason=${ev.reason})`,
                    );
                    isConnected = false;

                    // 長押しタイマーをクリア
                    stopAllLongPress();

                    // UI の復元
                    $("connect").disabled = false;
                    $("disconnect").disabled = true;
                    for (let i = 1; i <= buttonCount; i++) {
                        const sendButton = $(`send-key${i}`);
                        if (sendButton) sendButton.disabled = true;
                    }
                    $("status").textContent = "● Disconnected";
                    $("status").className = "status-disconnected";
                    $("connection-section").classList.remove("connected");
                    $("main-controls").style.opacity = "0.3";
                    $("main-controls").style.pointerEvents = "none";

                    // 入力のロックを解除
                    setInputsLocked(false);

                    // URLの入力欄を表示
                    $("url-input-group").classList.remove("hidden");
                };

                ws.onerror = (ev) => {
                    log("⚠️ ERROR occurred (check browser console)");
                    console.error(ev);
                };
            };

            $("disconnect").onclick = () => {
                if (ws) {
                    ws.close();
                    log("🔌 Disconnection requested");
                }
            };

            $("url").addEventListener("keypress", (e) => {
                if (e.key === "Enter" && !$("connect").disabled) {
                    $("connect").click();
                }
            });

            // ページを離れる時に長押しタイマーをクリア
            window.addEventListener("beforeunload", () => {
                stopAllLongPress();
            });

            // 初期化：デフォルトで1つのボタンを生成
            generateButtons(1);
            generateMessageSetup(1);

            // 初期ログメッセージ
            log(
                "🎯 WebSocket Client Ready - Enter URL and messages to connect",
            );
        </script>
    </body>
</html>
